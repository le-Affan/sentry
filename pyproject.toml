[project]
name = "telemetry-incident-report"
version = "0.1.0"
description = "Fine-tune Qwen2.5-3B-Instruct to turn raw security telemetry into structured incident reports."
requires-python = ">=3.10,<3.14"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
